services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - POSEFLOW_SOURCE=samples/people-detection.mp4
    command: uvicorn apps.api:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    ports: ["8501:8501"]
    command: streamlit run apps/dashboard.py --server.address 0.0.0.0 --server.port 8501
